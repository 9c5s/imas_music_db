---
# Lefthook設定ファイル - Git hookによる自動品質チェック
pre-commit:
  parallel: true
  commands:
    # メインブランチへの直接コミットを防止
    protect-branch:
      run: >
        d=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null|sed s,.*/,,)&&
        [ x${d} != x ]&&
        [ $(git symbolic-ref --short HEAD) = $d ]&&
        echo Direct commits to $d are not allowed. Use a feature branch.&&
        exit 1;true

    # Python品質チェック
    python-lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    python-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true

    # YAML品質チェック
    yaml-lint:
      glob: "*.{yaml,yml}"
      run: uv run yamllint {staged_files}
    yaml-format:
      glob: "*.{yaml,yml}"
      run: uv run yamlfix {staged_files}
      stage_fixed: true

    # シェルスクリプト品質チェック
    shell-lint:
      glob: "*.sh"
      run: uv run shellcheck {staged_files}
    shell-format:
      glob: "*.sh"
      run: uv run shfmt -i 2 -p -s -ci -sr -fn -w {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    # より包括的な品質チェック（全ファイル対象）
    python-check-all:
      run: uv run ruff check .
    yaml-check-all:
      run: uv run yamllint .
    shell-check-all:
      run: |
        if ls ./*.sh 1> /dev/null 2>&1; then
          uv run shellcheck ./*.sh
        fi

# メッセージ設定
colors: true
no_tty: false

# Gitのカラー出力を有効化
output:
  - meta
  - summary
